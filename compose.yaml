services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler -d scheduler']
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - '55432:5432'
    volumes:
      - scheduler-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://scheduler:scheduler@db:5432/scheduler
      DATABASE_SSL: 'false'
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:3000
      OTEL_ENABLED: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'

  migrate:
    build:
      context: .
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/shared/database/data-source.js',
      ]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://scheduler:scheduler@db:5432/scheduler
      DATABASE_SSL: 'false'
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

volumes:
  scheduler-postgres:
