name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scheduler_test
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler -d scheduler_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://scheduler:scheduler@localhost:5432/scheduler_test
      TEST_DATABASE_URL: postgresql://scheduler:scheduler@localhost:5432/scheduler_test
      DATABASE_SSL: 'false'
      PORT: 3000
      LOG_LEVEL: silent
      CORS_ORIGINS: http://localhost:3000
      OTEL_ENABLED: 'false'
      OTEL_SERVICE_NAME: unified-service-scheduler
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 1000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm migration:run
      - run: pnpm seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm test:concurrency
      - run: pnpm build
      - run: pnpm openapi:generate
